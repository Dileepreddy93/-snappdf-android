name: snappdf
description: "SnapPDF Pro - offline PDF, photo and document tools for Android."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: 3.47.7

# Versions are pinned exactly; pubspec.lock is committed. Every dependency is
# permissively licensed (MIT / BSD / Apache-2.0). See docs/LICENSES.md.
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: 3.4.3
  go_router: 18.0.2
  pdfrx: 2.6.5
  image: 4.10.1
  path_provider: 2.1.6
  path: 1.9.1
  uuid: 4.6.0
  intl: 0.20.3
  crypto: 3.0.7
  collection: 1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

include: package:flutter_lints/flutter.yaml

formatter:
  page_width: 120

analyzer:
  language:
    strict-casts: false
  errors:
    todo: ignore
  exclude:
    - build/**
    - android/**

linter:
  rules:
    - prefer_final_locals
    - avoid_print
    - cancel_subscriptions
    - unawaited_futures

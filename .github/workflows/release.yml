name: Release build

# Builds a signed Android App Bundle (for Play) and split APKs.
# Required repository secrets (never commit these):
#   SNAPPDF_KEYSTORE_BASE64   base64 of the upload keystore (.jks)
#   SNAPPDF_KEYSTORE_PASSWORD keystore password
#   SNAPPDF_KEY_ALIAS         key alias
#   SNAPPDF_KEY_PASSWORD      key password
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Check signing secrets
        env:
          KS: ${{ secrets.SNAPPDF_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.SNAPPDF_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.SNAPPDF_KEY_ALIAS }}
          KP: ${{ secrets.SNAPPDF_KEY_PASSWORD }}
        run: |
          missing=0
          for v in KS KSP KA KP; do [ -z "${!v}" ] && { echo "::error::Missing signing secret ($v)"; missing=1; }; done
          exit $missing

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test

      - name: Decode keystore
        run: |
          echo "${{ secrets.SNAPPDF_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "SNAPPDF_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build signed AAB and APKs
        env:
          SNAPPDF_KEYSTORE_PASSWORD: ${{ secrets.SNAPPDF_KEYSTORE_PASSWORD }}
          SNAPPDF_KEY_ALIAS: ${{ secrets.SNAPPDF_KEY_ALIAS }}
          SNAPPDF_KEY_PASSWORD: ${{ secrets.SNAPPDF_KEY_PASSWORD }}
        run: |
          flutter build appbundle --release
          flutter build apk --release --split-per-abi

      - name: Verify signatures are not the debug key
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          $APKSIGNER verify --print-certs build/app/outputs/flutter-apk/app-arm64-v8a-release.apk | tee certs.txt
          if grep -q "CN=Android Debug" certs.txt; then echo "::error::Signed with the debug key"; exit 1; fi
          jarsigner -verify build/app/outputs/bundle/release/app-release.aab | tail -1

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: snappdf-release
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/*-release.apk

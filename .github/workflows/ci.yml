name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  build-and-test:
    name: Analyze, test, build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test

      - name: Static analysis
        run: flutter analyze

      - name: Dart unit and widget tests
        run: flutter test --reporter expanded --file-reporter json:build/dart-test-results.json

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Kotlin JVM unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Verify release manifest has no network or storage permissions
        run: |
          flutter build apk --release --split-per-abi --target-platform android-arm64
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt2 | tail -1)
          $AAPT dump permissions build/app/outputs/flutter-apk/app-arm64-v8a-release.apk | tee build/permissions.txt
          if grep -E "INTERNET|READ_EXTERNAL|WRITE_EXTERNAL|MANAGE_EXTERNAL|READ_MEDIA" build/permissions.txt; then
            echo "::error::Release build requests a forbidden permission"; exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: snappdf-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

      - name: Summary
        if: always()
        run: |
          {
            echo "## SnapPDF CI"
            echo ""
            if [ -f build/dart-test-results.json ]; then
              PASS=$(grep -c '"result":"success"' build/dart-test-results.json || true)
              FAIL=$(grep -c '"result":"failure"\|"result":"error"' build/dart-test-results.json || true)
              SKIP=$(grep -c '"skipped":true' build/dart-test-results.json || true)
              echo "| Suite | Passed | Failed | Skipped |"
              echo "|---|---|---|---|"
              echo "| Dart unit + widget | $PASS | $FAIL | $SKIP |"
            fi
            if ls android/app/build/test-results/testDebugUnitTest/*.xml >/dev/null 2>&1 || ls build/app/test-results/testDebugUnitTest/*.xml >/dev/null 2>&1; then
              echo ""
              echo "Kotlin JVM tests: $(cat build/app/test-results/testDebugUnitTest/*.xml 2>/dev/null | grep -o 'tests="[0-9]*"' | head -1)"
            fi
            if [ -f build/app/outputs/flutter-apk/app-debug.apk ]; then
              echo ""
              echo "Debug APK: $(du -h build/app/outputs/flutter-apk/app-debug.apk | cut -f1) (artifact: snappdf-debug-apk)"
            fi
            echo ""
            echo "_A debug APK is a testing build. It is not a Play Store release._"
          } >> "$GITHUB_STEP_SUMMARY"

  device-tests:
    name: Engine and integration tests on Android emulator
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get --enforce-lockfile

      - name: Build once (generates the Gradle wrapper)
        run: flutter build apk --debug

      - name: Run instrumented engine tests and Flutter integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            cd android && ./gradlew :app:connectedDebugAndroidTest --no-daemon && cd ..
            flutter test integration_test --reporter expanded

      - name: Upload device test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            build/app/reports/androidTests/
            build/app/outputs/androidTest-results/
          retention-days: 14
